name: Audited Next.js Upgrade Scratch

on:
  push:
    branches: ["fix/website-dependency-security-next15"]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'chore: launch audited Next 15 upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Next.js to September 2026 patched release
        run: npm install next@15.5.27 eslint-config-next@15.5.27 --save-exact
      - name: Apply nonbreaking dependency resolutions
        run: npm audit fix --omit=dev || true
      - name: Test database quota
        run: npm run test:quota
      - name: Build entire website
        env:
          NEXT_PUBLIC_APP_URL: https://suitemigrate.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          GEMINI_API_KEY: test-gemini-key
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
          RAZORPAY_KEY_SECRET: test-secret
          RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
          RAZORPAY_PLAN_PRO_MONTHLY: plan_placeholder
          EXTENSION_ID: ohdcofhfnjahaoblipdcpflainibhcld
        run: npm run build
      - name: Save verified dependency upgrade to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade patched Next.js dependencies" || exit 0
          git push origin HEAD:fix/website-dependency-security-next15
      - name: Remaining production dependency audit
        run: npm audit --omit=dev --audit-level=high || true
